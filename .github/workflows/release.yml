name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Only publish the existing draft release for this tag (e.g. v1.2.1), without rebuilding"
        required: false
        default: ""

jobs:
  build-tauri:
    if: github.event_name == 'push' || inputs.publish_tag == ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arch: aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arch: x86_64
          - platform: ubuntu-22.04
            args: ""
            arch: x86_64
          - platform: windows-latest
            args: ""
            arch: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux-only: install required system libraries for WebKit/GTK
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Apple signing assets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple/certificate.p12"
          KEY_FILE="$RUNNER_TEMP/apple/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          # Accept the key pasted with literal "\n" sequences as well as real newlines.
          printf '%b' "$APPLE_API_PRIVATE_KEY_P8" | tr -d '\r' > "$KEY_FILE"
          # Fail here with a clear message instead of minutes later at notarization
          # ("invalidPEMDocument").
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_FILE" || ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::APPLE_API_PRIVATE_KEY_P8 is empty or not a valid .p8 key. Paste the whole AuthKey_<ID>.p8 file, including the BEGIN/END PRIVATE KEY lines."
            exit 1
          fi

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p build build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p build build.keychain
          security import "$RUNNER_TEMP/apple/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k build build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Validate tag matches app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); console.log(cfg.version)")
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          echo "Tag: $TAG"
          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          test "$TAG" = "$PKG_VERSION"
          test "$TAG" = "$TAURI_VERSION"
          test "$TAG" = "$CARGO_VERSION"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # In-app updates (optional): see docs/auto-updates.md
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ResourceScope ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/Cosm00/resourcescope/blob/main/CHANGELOG.md) for details.

            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.app.tar.gz` / `.dmg` (aarch64) |
            | macOS (Intel) | `.app.tar.gz` / `.dmg` (x86_64) |
            | Windows | `.msi` / `.exe` (NSIS) |
            | Linux | `.AppImage` / `.deb` |
          # Built as a draft so a half-uploaded release is never public; the
          # publish-release job below publishes it once every platform succeeded.
          releaseDraft: true
          prerelease: false
          # Signed updater bundles + latest.json are only produced once the
          # signing key secret exists, so releases keep working without it.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config {"bundle":{"createUpdaterArtifacts":true}}' || '' }}

      - name: Staple macOS app and DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP_PATH=$(find src-tauri/target -type d -name 'ResourceScope.app' | head -n 1)
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' | head -n 1)
          if [ -n "$APP_PATH" ]; then xcrun stapler staple "$APP_PATH" || true; fi
          if [ -n "$DMG_PATH" ]; then xcrun stapler staple "$DMG_PATH" || true; fi

  # Publish the draft (and mark it Latest) only after every platform built and
  # uploaded. Installed apps look for updates at
  # releases/latest/download/latest.json, which only resolves for published
  # releases — without this step releases stayed drafts and nobody saw them.
  publish-release:
    needs: build-tauri
    if: >-
      always() && (
        (github.event_name == 'push' && needs.build-tauri.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.publish_tag || github.ref_name }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets \
            --jq '"Published \(.url) (draft: \(.isDraft), \(.assets | length) assets)"'
